<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="904" viewBox="0 0 1200 904" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="title">Agentic SOC reference Compose deployment</title><desc id="desc">Topology of deploy/docker-compose.agnostic.yml on one Docker host, Compose project tlsoc-agentic-soc. A browser reaches tlsoc-webui (nginx, container port 80) on published host port 8080; nginx serves the Console and the Help Center and proxies /api/, the event stream and the chat stream to tlsoc-backend on port 8088. tlsoc-backend (FastAPI) is also published on host port 8088 for direct API access and HTTP push senders; receiver ports such as syslog 1514 are published only if you add them. The backend stores its state in tlsoc-postgres (pgvector/pgvector:pg16, port 5432, not published) on the named volume tlsoc-pgdata, and caches in tlsoc-redis (redis:7-alpine, port 6379, not published, no persistence). The backend makes outbound read-only connections to your security sources and outbound calls to model providers and threat-intel enrichment providers. agentic-soc-updater is the private update supervisor: read-only, all capabilities dropped, no new privileges. It talks to the backend only over control.sock on the shared named volume agentic-soc-updater-control, keeps its jobs and backups on the named volumes agentic-soc-updater-state and agentic-soc-updater-backups, and is the only service that mounts /var/run/docker.sock. It also mounts the Compose file and .env read-only and the .agentic-soc-runtime directory, and fetches signed, digest-pinned releases from the trusted repository only for an update an administrator approves.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#9198a1"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0.8 L0,5 L10,9.2 z" fill="#9198a1"/></marker></defs><rect x="0.5" y="0.5" width="1199" height="903" rx="14" fill="#0d1117" stroke="#3d444d"/><text x="32" y="42" font-size="22" fill="#f0f6fc" font-weight="600">Agentic SOC reference Compose deployment</text>
<text x="32" y="66" font-size="13.5" fill="#9198a1">What deploy/docker-compose.agnostic.yml starts on one Docker host. Only ports 8080 and 8088 are published to the host.</text>
