version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Etc/UTC
    target-branch: Testing
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "03:15"
      timezone: Etc/UTC
    target-branch: Testing
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
  - package-ecosystem: docker
    directory: /webui
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Etc/UTC
    target-branch: Testing
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
  - package-ecosystem: docker
    directory: /updater
    schedule:
      interval: weekly
      day: monday
      time: "03:45"
      timezone: Etc/UTC
    target-branch: Testing
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
