name: CI

# Nineteen independently visible status checks: eighteen repository-native quality
# gates plus one fail-closed branch-protection target. Keep "CI passed" required on
# main and Testing; the individual jobs make a failure immediately diagnosable.

on:
  pull_request:
  push:
    branches: [main, Testing]
    tags: ["v*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  repository-contracts:
    name: Repository & version contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Check canonical version and release metadata
        env:
          TLSOC_SOURCE_REF: ${{ github.ref }}
          TLSOC_RELEASE_CHANNEL: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'stable' || 'testing' }}
        run: python scripts/check_version.py

  backend-tests:
    name: Backend tests (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Check the resolved Python environment
        run: python -m pip check
      - name: Run the complete offline suite
        run: python -m pytest -q

  backend-package:
    name: Backend package integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install runtime dependencies and the pinned package builder
        run: |
          python -m pip install --requirement requirements.txt build==1.2.2.post1
          python -m pip check
      - name: Build wheel and source distribution
        run: python -m build --sdist --wheel --outdir dist
      - name: Verify shipped runtime data and installability
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          assert len(wheels) == 1, f"expected one wheel, found {wheels}"
          assert len(sdists) == 1, f"expected one sdist, found {sdists}"
          with ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
          required = {
              "app/llm/model_registry.json",
              "app/threat/mitre_techniques.json",
              "app/threat/SOURCE.md",
          }
          missing = sorted(required - names)
          assert not missing, f"wheel is missing runtime data: {missing}"
          assert any(name.startswith("app/runbooks/") and name.endswith(".md") for name in names)
          assert any(name.startswith("playbooks/") and name.endswith(".md") for name in names)
          PY
          python -m pip install --no-deps --target "${RUNNER_TEMP}/wheel-site" dist/*.whl
          cd "${RUNNER_TEMP}"
          EXPECTED_VERSION="$(tr -d '[:space:]' < "${GITHUB_WORKSPACE}/VERSION")" \
          PYTHONPATH="${RUNNER_TEMP}/wheel-site" \
            python - <<'PY'
          import os
          from importlib.metadata import version

          import app
          from app.main import app as fastapi_app, discover_feature_routers

          expected = os.environ["EXPECTED_VERSION"]
          assert app.__version__ == fastapi_app.version == expected
          assert version("tlsoc-agentic-triage") == expected
          routers = discover_feature_routers()
          names = [name for name, _router in routers]
          assert names == sorted(names)
          assert len(names) == len(set(names))
          print(f"installed wheel verified with {len(names)} feature routers")
          PY
      - name: Upload backend distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-distributions-${{ github.sha }}
          path: backend/dist/*
          if-no-files-found: error
          retention-days: 7

  backend-smoke:
    name: Backend startup smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install production dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Compile and boot against isolated SQLite state
        env:
          STATE_BACKEND: sqlite
          STATE_DB_URL: sqlite+aiosqlite:///${{ runner.temp }}/agentic-soc-ci.db
          AUTH_ENABLED: "false"
          ES_STORE_ENABLED: "false"
          REDIS_URL: redis://127.0.0.1:1
          LOG_LEVEL: WARNING
        run: |
          python -m compileall -q app
          smoke_log="${RUNNER_TEMP}/agentic-soc-backend-smoke.log"
          python -m uvicorn app.main:app --host 127.0.0.1 --port 18088 \
            >"${smoke_log}" 2>&1 &
          server_pid=$!
          cleanup() {
            status=$?
            trap - EXIT
            kill "${server_pid}" 2>/dev/null || true
            wait "${server_pid}" 2>/dev/null || true
            if (( status != 0 )); then
              cat "${smoke_log}"
            fi
            exit "${status}"
          }
          trap cleanup EXIT
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          expected_version = Path("../VERSION").read_text(encoding="utf-8").strip()
          live_url = "http://127.0.0.1:18088/api/health/live"
          ready_url = "http://127.0.0.1:18088/api/health/ready"
          last_error = None
          for _ in range(120):
              try:
                  with urllib.request.urlopen(ready_url, timeout=1) as response:
                      ready = json.load(response)
                  assert response.status == 200
                  assert ready["status"] == "ready", ready
                  assert ready["ready"] is True, ready
                  assert ready["version"] == expected_version, ready
                  assert ready["store_type"] == "SQLiteStateStore", ready
                  assert ready["checks"] == {"state_store": True}, ready
                  with urllib.request.urlopen(live_url, timeout=1) as response:
                      live = json.load(response)
                  assert response.status == 200
                  assert live == {
                      "status": "ok",
                      "service": "tlsoc-agentic-triage",
                      "version": expected_version,
                  }
                  break
              except (AssertionError, OSError, urllib.error.URLError) as exc:
                  last_error = exc
                  time.sleep(0.25)
          else:
              raise SystemExit(f"backend did not become ready: {last_error}")
          PY
          kill "${server_pid}"
          wait "${server_pid}" || true
          trap - EXIT

  postgres-redis:
    name: PostgreSQL & Redis acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
        env:
          POSTGRES_USER: tlsoc
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: tlsoc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tlsoc -d tlsoc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install production dependencies
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip check
      - name: Boot and verify the supported production state path
        env:
          STATE_BACKEND: postgres
          STATE_DB_URL: postgresql+asyncpg://tlsoc:ci-postgres-password@127.0.0.1:5432/tlsoc
          REDIS_URL: redis://127.0.0.1:6379/0
          AUTH_ENABLED: "false"
          ES_STORE_ENABLED: "false"
          LOG_LEVEL: WARNING
        run: |
          state_log="${RUNNER_TEMP}/agentic-soc-postgres-state.log"
          python -m uvicorn app.main:app --host 127.0.0.1 --port 18088 \
            >"${state_log}" 2>&1 &
          server_pid=$!
          cleanup() {
            status=$?
            trap - EXIT
            kill "${server_pid}" 2>/dev/null || true
            wait "${server_pid}" 2>/dev/null || true
            if (( status != 0 )); then
              cat "${state_log}"
            fi
            exit "${status}"
          }
          trap cleanup EXIT
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          expected_version = Path("../VERSION").read_text(encoding="utf-8").strip()
          ready_url = "http://127.0.0.1:18088/api/health/ready"
          last_error = None
          for _ in range(120):
              try:
                  with urllib.request.urlopen(ready_url, timeout=1) as response:
                      ready = json.load(response)
                  assert response.status == 200
                  assert ready == {
                      "status": "ready",
                      "ready": True,
                      "version": expected_version,
                      "store_type": "PostgresStateStore",
                      "checks": {"state_store": True},
                  }, ready
                  break
              except (AssertionError, OSError, urllib.error.URLError) as exc:
                  last_error = exc
                  time.sleep(0.25)
          else:
              raise SystemExit(f"PostgreSQL backend did not become ready: {last_error}")
          PY
          python - <<'PY'
          import asyncio
          import os

          import redis.asyncio as redis
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine

          async def verify() -> None:
              engine = create_async_engine(os.environ["STATE_DB_URL"])
              try:
                  async with engine.connect() as connection:
                      sentinel = await connection.scalar(text(
                          "SELECT count(*) FROM kv "
                          "WHERE namespace = 'health' AND key = 'readiness'"
                      ))
                      vector = await connection.scalar(text(
                          "SELECT count(*) FROM pg_extension WHERE extname = 'vector'"
                      ))
                  assert sentinel == 1, f"readiness sentinel count={sentinel}"
                  assert vector == 1, f"pgvector extension count={vector}"
              finally:
                  await engine.dispose()

              client = redis.from_url(os.environ["REDIS_URL"])
              try:
                  assert await client.ping() is True
              finally:
                  await client.aclose()

          asyncio.run(verify())
          PY
          kill "${server_pid}"
          wait "${server_pid}" || true
          trap - EXIT

  webui-tests:
    name: Web UI tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run the complete quiet Vitest suite
        run: npm run test:strict

  types-and-api:
    name: TypeScript & OpenAPI drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install backend and Web UI dependencies
        run: |
          python -m pip install --requirement backend/requirements.txt
          npm ci --prefix webui
      - name: Fail on generated API drift
        env:
          TLSOC_REQUIRE_TYPEGEN: "1"
        run: npm --prefix webui run check:types
      - name: Type-check the application
        run: npm --prefix webui run typecheck

  webui-lint:
    name: Web UI lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run ESLint, accessibility, and hooks rules
        run: npm run lint -- --max-warnings=0

  design-gates:
    name: Design-system gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Enforce tokens, contrast, CVD, and grep guards
        run: npm run gates

  docs:
    name: Help Center & docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install the pinned Help Center toolchain
        run: python -m pip install --requirement docs/requirements.txt
      - name: Check documentation links and structure
        run: python scripts/check_docs.py
      - name: Test bundle and theme contracts
        run: |
          python scripts/test_build_docs_bundle.py
          python scripts/test_docs_theme.py
      - name: Build and revalidate the versioned Help Center
        env:
          TLSOC_RELEASE_CHANNEL: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'stable' || 'testing' }}
        run: |
          python scripts/run_docs_bundle.py --output /tmp/agentic-soc-docs
          python scripts/run_docs_bundle.py --output /tmp/agentic-soc-docs --check-only

  webui-build:
    name: Web UI production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install locked dependencies
        run: npm ci
      - name: Install the pinned Help Center toolchain
        run: python -m pip install --requirement ../docs/requirements.txt
      - name: Build the release-complete production bundle
        env:
          TLSOC_RELEASE_CHANNEL: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'stable' || 'testing' }}
          TLSOC_BUILD_SHA: ${{ github.sha }}
        run: |
          TLSOC_BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          export TLSOC_BUILD_DATE
          npm run build
      - name: Upload Web UI production bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webui-production-${{ github.sha }}
          path: webui/dist/
          if-no-files-found: error
          retention-days: 7

  workflow-shell-contracts:
    name: Workflow & shell contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: .ci/requirements.txt
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.23.6"
          cache: false
      - name: Install pinned CI policy dependencies
        run: python -m pip install --requirement .ci/requirements.txt
      - name: Enforce fail-closed workflow policy
        run: |
          python scripts/check_ci_contract.py
          python -m unittest scripts.test_check_ci_contract -v
      - name: Install the verified ShellCheck binary
        env:
          SHELLCHECK_VERSION: "0.10.0"
          SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
        run: |
          archive="${RUNNER_TEMP}/shellcheck.tar.xz"
          curl --fail --silent --show-error --location \
            --output "${archive}" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  ${archive}" | sha256sum --check
          tar -xJf "${archive}" -C "${RUNNER_TEMP}"
          install -d "${RUNNER_TEMP}/bin"
          install -m 0755 \
            "${RUNNER_TEMP}/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" \
            "${RUNNER_TEMP}/bin/shellcheck"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - name: Validate every GitHub Actions workflow with ShellCheck
        run: |
          shellcheck --version
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Validate every tracked shell script
        run: |
          while IFS= read -r -d '' script; do
            echo "checking ${script}"
            bash -n "${script}"
          done < <(git ls-files -z '*.sh')

  bootstrap-bash32:
    name: Bootstrap portability (macOS Bash 3.2)
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Exercise the shipping supervisor invocation on Bash 3.2
        run: |
          test "$(/bin/bash -c 'printf "%s.%s" "${BASH_VERSINFO[0]}" "${BASH_VERSINFO[1]}"')" = "3.2"
          /bin/bash -n scripts/bootstrap-updater.sh
          python3 scripts/test_bootstrap_bash32.py

  deploy-contracts:
    name: Deploy & updater contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install updater wire-contract dependencies
        run: python -m pip install pydantic==2.6.4 httpx==0.27.0
      - name: Reject an invalid local demo mode before startup
        run: |
          set +e
          DEMO_MODE=invalid bash scripts/run-demo.sh >/tmp/invalid-demo-mode.log 2>&1
          status=$?
          set -e
          cat /tmp/invalid-demo-mode.log
          [[ "${status}" -eq 2 ]]
          grep -Fq "DEMO_MODE must be 'live' or 'seeded'" /tmp/invalid-demo-mode.log
      - name: Validate standalone Compose topology
        env:
          TLSOC_PG_PASSWORD: ci-compose-password
        run: |
          docker compose -f deploy/docker-compose.agnostic.yml config --quiet
          docker compose -f deploy/docker-compose.agnostic.yml config --format json \
            > /tmp/standalone-compose.json
          jq -e '.services["tlsoc-backend"].depends_on["agentic-soc-updater"] == null' \
            /tmp/standalone-compose.json
          docker compose -f deploy/docker-compose.agnostic.yml config --services \
            | LC_ALL=C sort > /tmp/actual-services
          printf '%s\n' agentic-soc-updater tlsoc-backend tlsoc-postgres tlsoc-redis tlsoc-webui \
            | LC_ALL=C sort > /tmp/expected-services
          diff -u /tmp/expected-services /tmp/actual-services
      - name: Test signed updater contracts and rollback state machine
        run: |
          python -m unittest discover -s updater/tests -v
          python -m py_compile updater/agentic_soc_updater/*.py \
            scripts/build_upgrade_plan.py scripts/compose_lifecycle_guard.py

  python-static:
    name: Python static correctness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: .ci/requirements.txt
      - name: Install pinned static-analysis tools
        run: python -m pip install --requirement .ci/requirements.txt
      - name: Reject fatal Python defects
        run: >-
          python -m ruff check backend/app backend/tests
          updater/agentic_soc_updater scripts --select E9,F63,F7,F82

  container-images:
    name: Release image build (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: backend
            dockerfile: backend/Dockerfile
            target: full
            image: agentic-soc-ci/backend
          - component: webui
            context: .
            dockerfile: webui/Dockerfile
            target: ""
            image: agentic-soc-ci/webui
          - component: updater
            context: updater
            dockerfile: updater/Dockerfile
            target: ""
            image: agentic-soc-ci/updater
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Resolve immutable candidate metadata
        id: metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          build_date="$(git show -s --format=%cI HEAD)"
          channel="testing"
          if [[ "${GITHUB_REF}" == refs/heads/main || "${GITHUB_REF}" == refs/tags/v* ]]; then
            channel="stable"
          fi
          {
            echo "version=${version}"
            echo "build_date=${build_date}"
            echo "channel=${channel}"
          } >> "${GITHUB_OUTPUT}"
      - name: Build the shipping image without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          sbom: false
          tags: ${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=release-image-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=release-image-${{ matrix.component }}
          build-args: |
            TLSOC_VERSION=${{ steps.metadata.outputs.version }}
            TLSOC_RELEASE_CHANNEL=${{ steps.metadata.outputs.channel }}
            TLSOC_BUILD_SHA=${{ github.sha }}
            TLSOC_BUILD_DATE=${{ steps.metadata.outputs.build_date }}
      - name: Verify image identity and runtime contract
        env:
          IMAGE: ${{ matrix.image }}:${{ github.sha }}
          COMPONENT: ${{ matrix.component }}
          EXPECTED_VERSION: ${{ steps.metadata.outputs.version }}
          EXPECTED_CHANNEL: ${{ steps.metadata.outputs.channel }}
          EXPECTED_DATE: ${{ steps.metadata.outputs.build_date }}
        run: |
          docker image inspect "${IMAGE}" > "${RUNNER_TEMP}/${COMPONENT}-image.json"
          jq -e \
            --arg version "${EXPECTED_VERSION}" \
            --arg channel "${EXPECTED_CHANNEL}" \
            --arg sha "${GITHUB_SHA}" \
            --arg created "${EXPECTED_DATE}" '
              .[0].Config.Labels["org.opencontainers.image.title"] != null and
              .[0].Config.Labels["org.opencontainers.image.version"] == $version and
              .[0].Config.Labels["dev.tlsoc.release.channel"] == $channel and
              .[0].Config.Labels["org.opencontainers.image.revision"] == $sha and
              .[0].Config.Labels["org.opencontainers.image.created"] == $created and
              .[0].Config.Healthcheck != null
            ' "${RUNNER_TEMP}/${COMPONENT}-image.json"
          case "${COMPONENT}" in
            backend)
              jq -e '.[0].Config.User == "10001:10001" and .[0].Config.ExposedPorts["8088/tcp"] != null' \
                "${RUNNER_TEMP}/${COMPONENT}-image.json"
              docker run --rm --entrypoint python "${IMAGE}" -m pip check
              docker run --rm --entrypoint python "${IMAGE}" -c \
                'from importlib.metadata import version; assert version("wheel") == "0.45.1"'
              ;;
            webui)
              jq -e '.[0].Config.ExposedPorts["80/tcp"] != null' \
                "${RUNNER_TEMP}/${COMPONENT}-image.json"
              ;;
            updater)
              jq -e '
                .[0].Config.Labels["io.agentic-soc.update-protocol"] == "1" and
                .[0].Config.User == "0:10001" and
                (.[0].Config.Env | index("TUF_ROOT=/var/lib/agentic-soc-updater/sigstore-root")) != null and
                .[0].Config.Entrypoint == ["python3", "-m", "agentic_soc_updater"]
              ' "${RUNNER_TEMP}/${COMPONENT}-image.json"
              ;;
          esac
      - name: Smoke updater control socket without Linux capabilities
        if: ${{ matrix.component == 'updater' }}
        env:
          IMAGE: ${{ matrix.image }}:${{ github.sha }}
        run: |
          set -Eeuo pipefail
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container="agentic-soc-ci-updater-${suffix}"
          control_volume="agentic-soc-ci-updater-control-${suffix}"
          state_volume="agentic-soc-ci-updater-state-${suffix}"
          backup_volume="agentic-soc-ci-updater-backup-${suffix}"
          runtime_volume="agentic-soc-ci-updater-runtime-${suffix}"
          cleanup() {
            docker rm --force "${container}" >/dev/null 2>&1 || true
            for volume in "${control_volume}" "${state_volume}" "${backup_volume}" "${runtime_volume}"; do
              docker volume rm --force "${volume}" >/dev/null 2>&1 || true
            done
          }
          trap cleanup EXIT
          for volume in "${control_volume}" "${state_volume}" "${backup_volume}" "${runtime_volume}"; do
            docker volume create "${volume}" >/dev/null
          done
          docker run --detach \
            --name "${container}" \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --health-interval 1s \
            --health-start-period 1s \
            --health-timeout 2s \
            --health-retries 10 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=67108864 \
            --mount "type=volume,source=${control_volume},target=/run/agentic-soc-updater" \
            --mount "type=volume,source=${state_volume},target=/var/lib/agentic-soc-updater" \
            --mount "type=volume,source=${backup_volume},target=/var/backups/agentic-soc" \
            --mount "type=volume,source=${runtime_volume},target=/deployment/host-runtime" \
            --env UPDATE_TRUSTED_REPOSITORY=ARYDESTROYER/Agentic-Kibana \
            --env UPDATE_COMPOSE_FILE=/deployment/docker-compose.yml \
            --env UPDATE_ENV_FILE=/deployment/.env \
            --env UPDATE_STATE_DIR=/var/lib/agentic-soc-updater \
            --env UPDATE_BACKUP_DIR=/var/backups/agentic-soc \
            --env UPDATE_HOST_OVERRIDE_FILE=/deployment/host-runtime/active-release.compose.yml \
            --env UPDATE_CONTROL_SOCKET=/run/agentic-soc-updater/control.sock \
            --env UPDATE_CONTROL_GID=10001 \
            "${IMAGE}" >/dev/null
          deadline=$((SECONDS + 60))
          health="starting"
          while (( SECONDS < deadline )); do
            health="$(docker inspect --format '{{.State.Health.Status}}' "${container}")"
            [[ "${health}" == healthy || "${health}" == unhealthy ]] && break
            sleep 1
          done
          if [[ "${health}" != healthy ]]; then
            docker logs "${container}"
            exit 1
          fi
          docker exec "${container}" sh -ceu '
            test "${TUF_ROOT}" = /var/lib/agentic-soc-updater/sigstore-root
            mkdir -p "${TUF_ROOT}"
            test -w "${TUF_ROOT}"
          '
          docker run --rm \
            --user 10001:10001 \
            --mount "type=volume,source=${control_volume},target=/run/agentic-soc-updater" \
            --entrypoint python3 \
            "${IMAGE}" -c '
          import os, socket, stat
          path = "/run/agentic-soc-updater/control.sock"
          details = os.lstat(path)
          assert stat.S_ISSOCK(details.st_mode)
          assert details.st_uid == 0
          assert details.st_gid == 10001
          assert stat.S_IMODE(details.st_mode) == 0o660
          client = socket.socket(socket.AF_UNIX)
          client.settimeout(2)
          client.connect(path)
          client.sendall(b"GET /v1/status HTTP/1.1\r\nHost: updater\r\nConnection: close\r\n\r\n")
          assert b"200 OK" in client.recv(256)
          '
      - name: Smoke the shipping Web Console health contract
        if: ${{ matrix.component == 'webui' }}
        env:
          IMAGE: ${{ matrix.image }}:${{ github.sha }}
        run: |
          set -Eeuo pipefail
          container="agentic-soc-ci-webui-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          backend_peer="agentic-soc-ci-webui-backend-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          network="agentic-soc-ci-webui-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm --force "${container}" >/dev/null 2>&1 || true
            docker rm --force "${backend_peer}" >/dev/null 2>&1 || true
            docker network rm "${network}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          # nginx resolves the production Compose service name at startup. Give
          # this standalone image smoke the same DNS contract without starting a
          # second application stack or reaching the host network.
          docker network create "${network}" >/dev/null
          docker run --detach \
            --name "${backend_peer}" \
            --network "${network}" \
            --network-alias tlsoc-backend \
            --entrypoint /bin/sh \
            "${IMAGE}" \
            -c 'sleep 300' >/dev/null
          docker run --detach \
            --name "${container}" \
            --network "${network}" \
            --publish 127.0.0.1:18080:80 \
            --health-interval 1s \
            --health-timeout 3s \
            --health-retries 5 \
            "${IMAGE}" >/dev/null
          for _ in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "${container}")"
            if [[ "${status}" == "healthy" ]]; then
              break
            fi
            if [[ "${status}" == "unhealthy" ]]; then
              docker inspect "${container}"
              docker logs "${container}"
              exit 1
            fi
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' "${container}")" = healthy
          curl --fail --silent --show-error http://127.0.0.1:18080/ >/dev/null

  ci:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - repository-contracts
      - backend-tests
      - backend-package
      - backend-smoke
      - postgres-redis
      - webui-tests
      - types-and-api
      - webui-lint
      - design-gates
      - docs
      - webui-build
      - workflow-shell-contracts
      - bootstrap-bash32
      - deploy-contracts
      - python-static
      - container-images
    steps:
      - name: Require every quality gate
        run: |
          results=(
            "${{ needs.repository-contracts.result }}"
            "${{ needs.backend-tests.result }}"
            "${{ needs.backend-package.result }}"
            "${{ needs.backend-smoke.result }}"
            "${{ needs.postgres-redis.result }}"
            "${{ needs.webui-tests.result }}"
            "${{ needs.types-and-api.result }}"
            "${{ needs.webui-lint.result }}"
            "${{ needs.design-gates.result }}"
            "${{ needs.docs.result }}"
            "${{ needs.webui-build.result }}"
            "${{ needs.workflow-shell-contracts.result }}"
            "${{ needs.bootstrap-bash32.result }}"
            "${{ needs.deploy-contracts.result }}"
            "${{ needs.python-static.result }}"
            "${{ needs.container-images.result }}"
          )
          printf 'quality gate results: %s\n' "${results[*]}"
          for result in "${results[@]}"; do
            [[ "${result}" == "success" ]] || exit 1
          done
          echo "All required checks passed."
