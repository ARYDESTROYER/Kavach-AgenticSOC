name: Documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - "overrides/**"
      - "mkdocs.yml"
      - "VERSION"
      - "scripts/check_version.py"
      - "scripts/check_docs.py"
      - ".github/workflows/docs.yml"
  push:
    # Branches validate previews. Only an exact immutable release tag publishes.
    branches: [main, Testing]
    tags: ["v*"]
    paths:
      - "docs/**"
      - "overrides/**"
      - "mkdocs.yml"
      - "VERSION"
      - "scripts/check_version.py"
      - "scripts/check_docs.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  # Preview builds may be superseded. A Stable publication must finish atomically.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  validate:
    name: Validate Help Center
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation dependencies
        run: python -m pip install --requirement docs/requirements.txt

      - name: Check canonical product and documentation versions
        env:
          TLSOC_SOURCE_REF: ${{ github.ref }}
          TLSOC_RELEASE_CHANNEL: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'stable' || 'testing' }}
        run: python scripts/check_version.py

      - name: Check documentation structure and links
        run: python scripts/check_docs.py

      - name: Build documentation
        env:
          TLSOC_DOCS_CHANNEL: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'Stable' || 'Testing' }}
          TLSOC_DOCS_EDIT_URI: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'edit/main/docs/' || 'edit/Testing/docs/' }}
        run: mkdocs build --strict

      - name: Upload documentation preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agentic-soc-docs-${{ github.sha }}
          path: site
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Assemble Stable documentation
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out repository with publication history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation dependencies
        run: python -m pip install --requirement docs/requirements.txt

      - name: Resolve documentation version
        id: version
        shell: bash
        run: |
          set -Eeuo pipefail
          product_version="$(tr -d '[:space:]' < VERSION)"
          expected_tag="v${product_version}"
          docs_version="$(printf '%s' "$product_version" | cut -d. -f1-2)"
          if [[ "${GITHUB_REF_NAME}" != "$expected_tag" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match VERSION ${product_version}." >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "$expected_tag")" != "tag" ]]; then
            echo "Stable documentation requires an annotated tag: $expected_tag" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          tag_commit="$(git rev-parse "${expected_tag}^{commit}")"
          main_commit="$(git rev-parse origin/main)"
          if [[ "$tag_commit" != "$main_commit" ]]; then
            echo "Release tag must resolve to the current verified main commit." >&2
            echo "tag=$tag_commit main=$main_commit" >&2
            exit 1
          fi
          if [[ ! "$docs_version" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid documentation version derived from VERSION: $docs_version" >&2
            exit 1
          fi
          echo "docs_version=$docs_version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$expected_tag" >> "$GITHUB_OUTPUT"

      - name: Require the exact tag CI run and fail-closed aggregate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        shell: bash
        run: |
          set -Eeuo pipefail
          deadline=$((SECONDS + 2400))
          while (( SECONDS < deadline )); do
            runs="$(gh api --method GET \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f event=push -f branch="${RELEASE_TAG}" -f per_page=100)"
            candidate="$(jq -c \
              --arg sha "${GITHUB_SHA}" \
              --arg tag "${RELEASE_TAG}" '
              [.workflow_runs[]
                | select(.event == "push" and .head_sha == $sha and .head_branch == $tag)]
              | sort_by(.run_started_at, .id)
              | last // empty
            ' <<<"${runs}")"
            if [[ -z "${candidate}" ]]; then
              sleep 15
              continue
            fi
            status="$(jq -r '.status' <<<"${candidate}")"
            if [[ "${status}" != completed ]]; then
              sleep 15
              continue
            fi
            conclusion="$(jq -r '.conclusion' <<<"${candidate}")"
            if [[ "${conclusion}" != success ]]; then
              printf 'Exact tag CI completed with conclusion %s; refusing documentation publication.\n' \
                "${conclusion}" >&2
              exit 1
            fi
            run_id="$(jq -r '.id' <<<"${candidate}")"
            jobs="$(gh api --method GET \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" \
              -f filter=latest -f per_page=100)"
            jq -e '
              [.jobs[]
                | select(.name == "CI passed")
                | select(.status == "completed" and .conclusion == "success")]
              | length == 1
            ' <<<"${jobs}" >/dev/null
            echo "Exact tag CI ${run_id} and CI passed aggregate are accepted."
            exit 0
          done
          echo "Timed out waiting for exact tag CI acceptance; refusing documentation publication." >&2
          exit 1

      - name: Require the exact signed Stable release before documentation publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        shell: bash
        run: |
          set -Eeuo pipefail
          deadline=$((SECONDS + 7200))
          while (( SECONDS < deadline )); do
            runs="$(gh api --method GET \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs" \
              -f event=push -f branch="${RELEASE_TAG}" -f per_page=100)"
            candidate="$(jq -c \
              --arg sha "${GITHUB_SHA}" \
              --arg tag "${RELEASE_TAG}" '
              [.workflow_runs[]
                | select(.event == "push" and .head_sha == $sha and .head_branch == $tag)]
              | sort_by(.run_started_at, .id)
              | last // empty
            ' <<<"${runs}")"
            if [[ -z "${candidate}" ]]; then
              sleep 15
              continue
            fi

            status="$(jq -r '.status' <<<"${candidate}")"
            if [[ "${status}" != completed ]]; then
              sleep 15
              continue
            fi
            conclusion="$(jq -r '.conclusion' <<<"${candidate}")"
            if [[ "${conclusion}" != success ]]; then
              printf 'Exact signed-release workflow completed with conclusion %s; refusing documentation publication.\n' \
                "${conclusion}" >&2
              exit 1
            fi

            if ! release="$(gh api --method GET \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 2>/dev/null)"; then
              sleep 5
              continue
            fi
            jq -e \
              --arg tag "${RELEASE_TAG}" \
              '
              .tag_name == $tag and
              .draft == false and
              .prerelease == false and
              (.published_at | type == "string" and length > 0) and
              (.assets | length == 2) and
              ([.assets[].name] | sort) == [
                "upgrade-plan.json",
                "upgrade-plan.sigstore.json"
              ] and
              all(.assets[]; .state == "uploaded" and .size > 0)
            ' <<<"${release}" >/dev/null || {
              echo "Published Stable release identity or asset inventory is invalid." >&2
              exit 1
            }

            release_inventory="${RUNNER_TEMP}/stable-release-inventory.json"
            release_notes="docs/releases/$(tr -d '[:space:]' < VERSION).md"
            jq -s '.' <<<"${release}" >"${release_inventory}"
            release_state="$(python3 scripts/release_asset_state.py \
              --inventory "${release_inventory}" \
              --tag "${RELEASE_TAG}" \
              --commit-sha "${GITHUB_SHA}" \
              --release-notes "${release_notes}")"
            jq -e '
              .release_state == "published" and
              .plan_exists == true and
              .bundle_exists == true and
              .delete_asset_ids == []
            ' <<<"${release_state}" >/dev/null || {
              echo "Published Stable release is not canonically bound to the exact tag commit and notes." >&2
              exit 1
            }
            printf 'Accepted signed-release workflow %s and exact published assets for %s.\n' \
              "$(jq -r '.id' <<<"${candidate}")" "${GITHUB_SHA}"
            exit 0
          done
          echo "Timed out waiting for the exact signed Stable release; refusing documentation publication." >&2
          exit 1

      - name: Update Stable version history
        env:
          TLSOC_DOCS_CHANNEL: Stable
          TLSOC_DOCS_EDIT_URI: edit/main/docs/
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mike deploy --update-aliases --alias-type=redirect \
            "${{ steps.version.outputs.docs_version }}" stable latest \
            --title "${{ steps.version.outputs.docs_version }} (Stable)"
          mike set-default stable

      - name: Assemble and validate the Pages tree
        shell: bash
        run: |
          set -Eeuo pipefail
          pages_dir="${RUNNER_TEMP}/pages-site"
          mkdir -p "$pages_dir"
          git archive gh-pages | tar -xf - -C "$pages_dir"

          test -f "$pages_dir/index.html"
          test -f "$pages_dir/${{ steps.version.outputs.docs_version }}/index.html"
          test -f "$pages_dir/stable/index.html"
          test -f "$pages_dir/latest/index.html"
          test -f "$pages_dir/versions.json"

          if find "$pages_dir" -type l -print -quit | grep -q .; then
            echo "The GitHub Pages artifact must not contain symbolic links." >&2
            exit 1
          fi

          git push --porcelain origin gh-pages

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/pages-site

  deploy:
    name: Deploy Stable documentation
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
