# Serve the SPA and proxy the API to the backend over the Compose network.
server {
    listen 80;
    server_name _;
    server_tokens off;
    # Keep redirects relative so deployments published on :8080 (or behind a
    # TLS ingress) do not lose their external scheme/port.
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    # Server-Sent-Events stream (Round 3 live UI: notifications / case activity /
    # agent steps). MUST NOT be buffered or it never reaches the browser; the longest-
    # prefix match means this wins over the generic /api/ block below regardless of
    # order. The backend also sets X-Accel-Buffering:no for defense-in-depth.
    location /api/events {
        proxy_pass http://tlsoc-backend:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Disable proxy buffering + chunked-encoding buffering so each SSE frame is
        # flushed to the client immediately.
        proxy_buffering off;
        proxy_cache off;
        # Keep the long-lived stream alive; clear Connection so it isn't downgraded
        # to keep-alive close, and allow a 1h read window between heartbeats.
        proxy_set_header Connection '';
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # Chat answer stream (NDJSON; chat revamp SPEC §6.1(c)). Unbuffered so every
    # lookup step and token-count line reaches the browser as it happens (the backend
    # also sends X-Accel-Buffering:no). The stream pings every 10 s while a step is
    # slow, so 120 s between reads is a generous dead-connection bound; a turn is
    # bounded by the backend's chat limits, not by this proxy. Longest-prefix match:
    # this wins over the generic /api/ block below.
    location /api/chat/stream {
        proxy_pass http://tlsoc-backend:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Reverse-proxy the backend API. The SPA calls relative /api/* paths, so the
    # browser never needs to know the backend's address (no CORS, no Kibana proxy).
    location /api/ {
        proxy_pass http://tlsoc-backend:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # LLM investigations can run for a while — be generous with timeouts.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # The installed, version-matched MkDocs manual is a real static site, not a
    # React route. Missing docs must remain 404s instead of falling through to
    # index.html and rendering an unrelated Console screen.
    location = /docs {
        include /etc/nginx/agentic-soc-security-headers.conf;
        return 308 /docs/;
    }
    location ^~ /docs/ {
        include /etc/nginx/agentic-soc-security-headers.conf;
        try_files $uri $uri/ =404;
    }

    # Downloadable operator examples are real static files. Missing examples
    # must remain 404s instead of returning the SPA document as a false success.
    # Revalidate them across releases because their URLs are intentionally stable.
    location ^~ /examples/ {
        include /etc/nginx/agentic-soc-security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # A running Console polls this tiny build artifact to discover an already-
    # deployed coherent release. It must never be cached or fall through to the SPA.
    location = /release.json {
        include /etc/nginx/agentic-soc-security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # SPA client-side routing fallback.
    location / {
        include /etc/nginx/agentic-soc-security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed assets; never cache index.html.
    location /assets/ {
        include /etc/nginx/agentic-soc-security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        include /etc/nginx/agentic-soc-security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}
