<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Preload the ONE primary sans face (Inter variable, latin subset). Vite
         resolves + hashes the node_modules asset at build; `crossorigin` is
         required for font preloads even same-origin (DESIGN_STANDARD §2.1). -->
    <link
      rel="preload"
      href="/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Agentic SOC</title>
    <!-- An empty favicon: browsers stop requesting /favicon.ico (a 404 in every console).
         A white-label favicon (Settings → Branding) replaces this link's href at runtime. -->
    <link rel="icon" href="data:," />
    <!-- Pre-paint theme stamp (WS-F task 8c). The body background is
         `hsl(var(--canvas))`, which differs light↔dark, so a dark-preferring user
         would flash a light body before React's first commit stamps `.dark`. This
         tiny BLOCKING script stamps the SAME `.dark` class + `colorScheme` the
         ThemeProvider uses (storage key `soc.theme`; 'system'/unset → OS), BEFORE
         first paint, so there is no flash. It is intentionally a pure mirror of
         theme.tsx's readStoredMode()+resolveDark(no branding)+applyDarkClass. -->
    <script>
      (function () {
        try {
          var m = window.localStorage.getItem('soc.theme');
          // Mirror theme.tsx readStoredMode(): ONLY the exact strings 'dark'/'light' are
          // explicit; ANY other value (unset, 'system', or a corrupt/unknown value) falls
          // through to the OS preference — so a corrupt `soc.theme` on a dark-preferring OS
          // can never flash a light frame.
          var dark =
            m === 'dark' ||
            (m !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var el = document.documentElement;
          el.classList.toggle('dark', !!dark);
          el.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          /* storage/matchMedia unavailable — leave the default light theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
