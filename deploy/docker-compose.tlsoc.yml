# =============================================================================
# Agentic SOC — service block to ADD to TLSOCDockerDeploy.
#
# HOW TO USE (see DEPLOY.md): copy the `tlsoc-backend` (and optional
# `tlsoc-redis`) entries below INTO the `services:` map of
# TLSOCDockerDeploy/docker-compose.yml. Do NOT modify any existing service.
#
# WHAT IT ADDS / DOES NOT TOUCH:
#   * Adds ONE core service (tlsoc-backend) + one OPTIONAL cache (tlsoc-redis).
#   * Joins the existing default Compose network (no `networks:` key needed) and
#     reaches Elasticsearch by container name over TLS (https://elasticsearch:9200).
#   * Reuses the existing CA cert (./certs/ca/ca.crt) read-only — it does NOT
#     regenerate or alter certs.
#   * Touches NO existing service, the log pipeline, or the ECS schema. The
#     backend is a read-only consumer of the all-logs-* surface.
# =============================================================================

services:
  tlsoc-backend:
    # Option A (default): build from this repo. Clone agentic-kibana next to the
    # compose file so the backend is at ./agentic-kibana/backend.
    build:
      context: ./agentic-kibana/backend
      dockerfile: Dockerfile
      args:
        TLSOC_VERSION: ${TLSOC_VERSION:-0.1.13}
        TLSOC_RELEASE_CHANNEL: ${TLSOC_RELEASE_CHANNEL:-testing}
        TLSOC_BUILD_SHA: ${TLSOC_BUILD_SHA:-unknown}
        TLSOC_BUILD_DATE: ${TLSOC_BUILD_DATE:-unknown}
    image: tlsoc-agentic-triage-backend:${TLSOC_VERSION:-0.1.13}
    # Option B: pre-build once, injecting truthful OCI metadata:
    # `docker build --build-arg TLSOC_VERSION=0.1.13 --build-arg TLSOC_RELEASE_CHANNEL=stable --build-arg TLSOC_BUILD_SHA=<git-sha> --build-arg TLSOC_BUILD_DATE=<rfc3339> -t tlsoc-agentic-triage-backend:0.1.13 ./agentic-kibana/backend`
    # then delete the `build:` block above and keep only the `image:` line.
    container_name: tlsoc-backend
    restart: unless-stopped
    depends_on:
      - elasticsearch
    environment:
      # --- Elasticsearch (TLS, container-name DNS) ---
      - ES_URL=https://elasticsearch:9200
      - ES_CA_CERT=/certs/ca.crt
      - ES_VERIFY_CERTS=true
      # --- Two scoped ES API keys (NEVER the elastic superuser) — see DEPLOY.md ---
      - ES_API_KEY=${TLSOC_ES_API_KEY}            # read-only, scoped to all-logs-*
      - ES_MGMT_API_KEY=${TLSOC_ES_MGMT_API_KEY}  # own indices; optional ILM/template/monitor cluster grants
      # --- Durable server-generated job artifacts (private backend volume) ---
      - JOBS_ARTIFACT_DIR=${TLSOC_JOBS_ARTIFACT_DIR:-/var/lib/agentic-soc/jobs}
      # --- LLM provider keys (at least one of anthropic/openai) ---
      - ANTHROPIC_API_KEY=${TLSOC_ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${TLSOC_OPENAI_API_KEY:-}
      # --- Enrichment + embeddings (optional) ---
      - ABUSEIPDB_API_KEY=${TLSOC_ABUSEIPDB_API_KEY:-}
      - VIRUSTOTAL_API_KEY=${TLSOC_VIRUSTOTAL_API_KEY:-}
      - EMBEDDING_API_KEY=${TLSOC_EMBEDDING_API_KEY:-}
      # --- Round-3 cloud LLM providers (all optional + default-off; Azure OpenAI /
      #     AWS Bedrock via stdlib SigV4 / Google Vertex). Set the matching TLSOC_*
      #     in .env to enable; see docs/ENVIRONMENT.md §2.6 and .env.example. ---
      - AZURE_OPENAI_API_KEY=${TLSOC_AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_ENDPOINT=${TLSOC_AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_VERSION=${TLSOC_AZURE_OPENAI_API_VERSION:-}
      - AWS_ACCESS_KEY_ID=${TLSOC_AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${TLSOC_AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${TLSOC_AWS_REGION:-}
      - VERTEX_PROJECT=${TLSOC_VERTEX_PROJECT:-}
      - VERTEX_LOCATION=${TLSOC_VERTEX_LOCATION:-}
      - VERTEX_API_KEY=${TLSOC_VERTEX_API_KEY:-}
      # --- Round-3 enrichment providers (all optional + default-off; the keyless
      #     ones — Shodan InternetDB / abuse.ch trio / RDAP — run without any key).
      #     Set the matching TLSOC_* in .env to enable a keyed provider; see
      #     docs/ENVIRONMENT.md §2.7 and .env.example. Field-name nuances are honored
      #     (IPINFO_TOKEN, CENSYS_API_ID/_SECRET, XFORCE_API_KEY/_PASSWORD,
      #     HONEYPOT_ACCESS_KEY, ABUSECH_AUTH_KEY). ---
      - GREYNOISE_API_KEY=${TLSOC_GREYNOISE_API_KEY:-}
      - SHODAN_API_KEY=${TLSOC_SHODAN_API_KEY:-}
      - CENSYS_API_ID=${TLSOC_CENSYS_API_ID:-}
      - CENSYS_API_SECRET=${TLSOC_CENSYS_API_SECRET:-}
      - BINARYEDGE_API_KEY=${TLSOC_BINARYEDGE_API_KEY:-}
      - IPINFO_TOKEN=${TLSOC_IPINFO_TOKEN:-}
      - OTX_API_KEY=${TLSOC_OTX_API_KEY:-}
      - PULSEDIVE_API_KEY=${TLSOC_PULSEDIVE_API_KEY:-}
      - SPUR_API_KEY=${TLSOC_SPUR_API_KEY:-}
      - XFORCE_API_KEY=${TLSOC_XFORCE_API_KEY:-}
      - XFORCE_API_PASSWORD=${TLSOC_XFORCE_API_PASSWORD:-}
      - URLSCAN_API_KEY=${TLSOC_URLSCAN_API_KEY:-}
      - HIBP_API_KEY=${TLSOC_HIBP_API_KEY:-}
      - HONEYPOT_ACCESS_KEY=${TLSOC_HONEYPOT_ACCESS_KEY:-}
      - ABUSECH_AUTH_KEY=${TLSOC_ABUSECH_AUTH_KEY:-}
      # --- Round-11 enrichment providers (all optional + default-off; the keyless
      #     ones — CIRCL hashlookup / DShield / Onionoo / Spamhaus / Cymru MHR /
      #     Robtex / crt.sh — run without any key). ---
      - CROWDSEC_API_KEY=${TLSOC_CROWDSEC_API_KEY:-}
      - GOOGLE_SAFEBROWSING_API_KEY=${TLSOC_GOOGLE_SAFEBROWSING_API_KEY:-}
      - IPQUALITYSCORE_API_KEY=${TLSOC_IPQUALITYSCORE_API_KEY:-}
      - IPDATA_API_KEY=${TLSOC_IPDATA_API_KEY:-}
      - APIVOID_API_KEY=${TLSOC_APIVOID_API_KEY:-}
      - MALTIVERSE_API_KEY=${TLSOC_MALTIVERSE_API_KEY:-}
      - SECURITYTRAILS_API_KEY=${TLSOC_SECURITYTRAILS_API_KEY:-}
      - CRIMINALIP_API_KEY=${TLSOC_CRIMINALIP_API_KEY:-}
      - NETLAS_API_KEY=${TLSOC_NETLAS_API_KEY:-}
      - HYBRID_ANALYSIS_API_KEY=${TLSOC_HYBRID_ANALYSIS_API_KEY:-}
      - METADEFENDER_API_KEY=${TLSOC_METADEFENDER_API_KEY:-}
      - EMAILREP_API_KEY=${TLSOC_EMAILREP_API_KEY:-}
      # --- Cache (optional; in-memory fallback if Redis is absent) ---
      - REDIS_URL=${TLSOC_REDIS_URL:-redis://tlsoc-redis:6379/0}
      - LOG_LEVEL=${TLSOC_LOG_LEVEL:-INFO}
    volumes:
      # Reuse the existing CA (generated by TLSOCDockerDeploy's generate-certs.sh).
      - ./certs/ca/ca.crt:/certs/ca.crt:ro
      # Keep completed export artifacts available across backend restarts. Merge the
      # matching top-level volume declaration below into the host Compose file too.
      - agentic-soc-job-artifacts:/var/lib/agentic-soc/jobs:rw
    ports:
      # Optional: only needed for direct API access/debugging. The Kibana plugin
      # reaches the backend over the internal network (http://tlsoc-backend:8088),
      # so you can remove this mapping in production.
      - "8088:8088"

  # OPTIONAL but recommended: enrichment cache. The backend runs fine without it
  # (it falls back to an in-memory cache), but Redis preserves the cache across
  # restarts and protects tight free-tier enrichment API limits.
  tlsoc-redis:
    image: redis:7-alpine
    container_name: tlsoc-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]

volumes:
  agentic-soc-job-artifacts:
