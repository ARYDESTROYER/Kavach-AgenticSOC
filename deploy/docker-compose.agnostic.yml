# =============================================================================
# Agentic SOC — self-contained, vendor-agnostic deployment (NO Elasticsearch
# required for the app's own state). Brings up:
#   * tlsoc-postgres : PostgreSQL + pgvector — the app's OWN state (cases/audit/
#                      usage/config/cursor/RAG). This replaces the tlsoc-agent-*
#                      Elasticsearch indices.
#   * tlsoc-redis    : enrichment + dedup cache (optional but recommended).
#   * tlsoc-backend  : FastAPI + LangGraph agent (state_backend=postgres).
#   * tlsoc-webui    : Agentic SOC, the standalone React SPA (nginx) — the first-run
#                      wizard + console. Talks to the backend via /api proxy.
#   * agentic-soc-updater : private Unix-socket supervisor for signed, digest-pinned
#                           application updates. It alone receives Docker authority.
#
# Your SIEM/EDR/XDR is NOT part of this stack — you connect to it from the UI's
# first-run wizard ("add a source"). Pull sources today: Elasticsearch /
# OpenSearch / Wazuh (point ES_URL + a read-only ES_API_KEY at that cluster).
# Push sources (webhook/HEC/syslog/Kafka/SQS/…): no ES needed at all.
#
# Run from the repo root through the lifecycle wrapper so a digest-pinned release
# selected by the updater cannot be reverted by a later Compose invocation:
#   cp .env.example .env   # fill in TLSOC_PG_PASSWORD + at least one LLM key
#   scripts/agentic-soc-compose.sh up -d --build
# Then open http://localhost:8080 and complete the setup wizard.
# =============================================================================

# Compatibility-stable machine slug. Renaming it changes Compose-managed volume
# names (including tlsoc-agentic-soc_tlsoc-pgdata) and requires an explicit migration.
name: tlsoc-agentic-soc

services:
  tlsoc-postgres:
    image: pgvector/pgvector:pg16
    container_name: tlsoc-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${TLSOC_PG_USER:-tlsoc}
      - POSTGRES_PASSWORD=${TLSOC_PG_PASSWORD:?set TLSOC_PG_PASSWORD in .env}
      - POSTGRES_DB=${TLSOC_PG_DB:-tlsoc}
    volumes:
      - tlsoc-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TLSOC_PG_USER:-tlsoc} -d ${TLSOC_PG_DB:-tlsoc}"]
      interval: 10s
      timeout: 5s
      retries: 5

  tlsoc-redis:
    image: redis:7-alpine
    container_name: tlsoc-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  tlsoc-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        # Keep this canonical updater-managed base file byte-stable across 0.1.x.
        # The lifecycle wrapper exports VERSION for source builds; signed releases
        # pin immutable images in the generated active-release override instead.
        TLSOC_VERSION: ${TLSOC_VERSION:-source}
        TLSOC_RELEASE_CHANNEL: ${TLSOC_RELEASE_CHANNEL:-testing}
        TLSOC_BUILD_SHA: ${TLSOC_BUILD_SHA:-unknown}
        TLSOC_BUILD_DATE: ${TLSOC_BUILD_DATE:-unknown}
    image: tlsoc-agentic-triage-backend:${TLSOC_VERSION:-source}
    container_name: tlsoc-backend
    restart: unless-stopped
    depends_on:
      tlsoc-postgres:
        condition: service_healthy
    environment:
      # --- OWN-state backend: PostgreSQL + pgvector (no Elasticsearch) ---
      - STATE_BACKEND=postgres
      - STATE_DB_URL=postgresql+asyncpg://${TLSOC_PG_USER:-tlsoc}:${TLSOC_PG_PASSWORD}@tlsoc-postgres:5432/${TLSOC_PG_DB:-tlsoc}
      - REDIS_URL=${TLSOC_REDIS_URL:-redis://tlsoc-redis:6379/0}
      # --- LLM providers (configure at least one) ---
      - ANTHROPIC_API_KEY=${TLSOC_ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${TLSOC_OPENAI_API_KEY:-}
      # --- Enrichment + embeddings (optional) ---
      - ABUSEIPDB_API_KEY=${TLSOC_ABUSEIPDB_API_KEY:-}
      - VIRUSTOTAL_API_KEY=${TLSOC_VIRUSTOTAL_API_KEY:-}
      - EMBEDDING_API_KEY=${TLSOC_EMBEDDING_API_KEY:-}
      # --- Round-3 cloud LLM providers (all optional + default-off). The gateway
      #     supports Azure OpenAI / AWS Bedrock (stdlib SigV4) / Google Vertex in
      #     addition to ANTHROPIC/OPENAI above. Set the matching TLSOC_* in .env to
      #     enable; see docs/ENVIRONMENT.md §2.6 and .env.example. ---
      - AZURE_OPENAI_API_KEY=${TLSOC_AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_ENDPOINT=${TLSOC_AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_VERSION=${TLSOC_AZURE_OPENAI_API_VERSION:-}
      - AWS_ACCESS_KEY_ID=${TLSOC_AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${TLSOC_AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${TLSOC_AWS_REGION:-}
      - VERTEX_PROJECT=${TLSOC_VERTEX_PROJECT:-}
      - VERTEX_LOCATION=${TLSOC_VERTEX_LOCATION:-}
      - VERTEX_API_KEY=${TLSOC_VERTEX_API_KEY:-}
      # --- Round-3 enrichment providers (all optional + default-off; the keyless
      #     ones — Shodan InternetDB / abuse.ch trio / RDAP — run without any key).
      #     Set the matching TLSOC_* in .env to enable a keyed provider; see
      #     docs/ENVIRONMENT.md §2.7 and .env.example. Field-name nuances are honored
      #     (IPINFO_TOKEN, CENSYS_API_ID/_SECRET, XFORCE_API_KEY/_PASSWORD,
      #     HONEYPOT_ACCESS_KEY, ABUSECH_AUTH_KEY). ---
      - GREYNOISE_API_KEY=${TLSOC_GREYNOISE_API_KEY:-}
      - SHODAN_API_KEY=${TLSOC_SHODAN_API_KEY:-}
      - CENSYS_API_ID=${TLSOC_CENSYS_API_ID:-}
      - CENSYS_API_SECRET=${TLSOC_CENSYS_API_SECRET:-}
      - BINARYEDGE_API_KEY=${TLSOC_BINARYEDGE_API_KEY:-}
      - IPINFO_TOKEN=${TLSOC_IPINFO_TOKEN:-}
      - OTX_API_KEY=${TLSOC_OTX_API_KEY:-}
      - PULSEDIVE_API_KEY=${TLSOC_PULSEDIVE_API_KEY:-}
      - SPUR_API_KEY=${TLSOC_SPUR_API_KEY:-}
      - XFORCE_API_KEY=${TLSOC_XFORCE_API_KEY:-}
      - XFORCE_API_PASSWORD=${TLSOC_XFORCE_API_PASSWORD:-}
      - URLSCAN_API_KEY=${TLSOC_URLSCAN_API_KEY:-}
      - HIBP_API_KEY=${TLSOC_HIBP_API_KEY:-}
      - HONEYPOT_ACCESS_KEY=${TLSOC_HONEYPOT_ACCESS_KEY:-}
      - ABUSECH_AUTH_KEY=${TLSOC_ABUSECH_AUTH_KEY:-}
      # --- Optional: a read-only key for an Elasticsearch/OpenSearch/Wazuh LOG
      #     source. You can instead add this in the wizard. Pull-source field
      #     mapping is per-source (set in the wizard); these point at the cluster. ---
      - ES_URL=${TLSOC_ES_URL:-}
      - ES_API_KEY=${TLSOC_ES_API_KEY:-}
      - ES_CA_CERT=${TLSOC_ES_CA_CERT:-}
      - ES_VERIFY_CERTS=${TLSOC_ES_VERIFY_CERTS:-true}
      - LOG_LEVEL=${TLSOC_LOG_LEVEL:-INFO}
      # --- API auth + RBAC + MFA + SSO (default OFF; see DEMO.md / DEPLOY.md §9).
      #     Set TLSOC_AUTH_ENABLED=true + a stable TLSOC_AUTH_JWT_SECRET in .env to
      #     get the login screen, the 6-role RBAC, and the MFA/SSO surfaces. When
      #     auth is on and the user store is empty, the backend auto-seeds a demo
      #     super_admin (Admin / Admin@123 — change it for real use).
      #     DEMO example .env:
      #       TLSOC_AUTH_ENABLED=true
      #       TLSOC_AUTH_JWT_SECRET=<openssl rand -hex 32>
      - AUTH_ENABLED=${TLSOC_AUTH_ENABLED:-false}
      - AUTH_JWT_SECRET=${TLSOC_AUTH_JWT_SECRET:-}
      - AUTH_ADMIN_USERNAME=${TLSOC_AUTH_ADMIN_USERNAME:-admin}
      - AUTH_ADMIN_PASSWORD=${TLSOC_AUTH_ADMIN_PASSWORD:-}
      - AUTH_USERS=${TLSOC_AUTH_USERS:-{}}
      - AUTH_TOKEN_HOURS=${TLSOC_AUTH_TOKEN_HOURS:-12}
      # Set true behind a TLS terminator so the session cookie is HTTPS-only.
      - AUTH_COOKIE_SECURE=${TLSOC_AUTH_COOKIE_SECURE:-false}
      # MFA TOTP secret obfuscation key (blank -> derived from AUTH_JWT_SECRET).
      - MFA_OBFUSCATION_KEY=${TLSOC_MFA_OBFUSCATION_KEY:-}
      # SSO (OIDC) client secrets — JSON map of provider id -> secret (SECRET tier).
      # Register the IdP redirect URI as  <base-url>/api/auth/sso/callback .
      - SSO_CLIENT_SECRETS=${TLSOC_SSO_CLIENT_SECRETS:-{}}
      # --- Notification channel secrets (SMTP password / Slack/Teams/webhook URL /
      #     PagerDuty/Telegram token) — JSON map of channel id -> {field: value}. ---
      - NOTIFICATION_SECRETS=${TLSOC_NOTIFICATION_SECRETS:-{}}
      # --- Opt-in hardening middleware (independent of auth) ---
      - SECURITY_HEADERS_ENABLED=${TLSOC_SECURITY_HEADERS_ENABLED:-true}
      - RATE_LIMIT_ENABLED=${TLSOC_RATE_LIMIT_ENABLED:-false}
      - CSRF_ENABLED=${TLSOC_CSRF_ENABLED:-false}
      # Private control-plane socket. The backend can request a bounded update job;
      # it never receives the Docker socket, Compose files, registry credentials,
      # backup paths, or host-shell authority.
      - UPDATE_SUPERVISOR_SOCKET=/run/agentic-soc-updater/control.sock
    volumes:
      # Mount a CA cert here if your log cluster uses a private CA (then set
      # TLSOC_ES_CA_CERT=/certs/ca.crt). Safe to leave commented out.
      # - ./certs/ca.crt:/certs/ca.crt:ro
      - agentic-soc-updater-control:/run/agentic-soc-updater:rw
    ports:
      # Direct API access (the UI reaches it internally via the /api proxy).
      - "8088:8088"
    # Inbound PUSH ingestion ports (syslog/raw-socket receivers) bind inside the
    # container; publish the ones you configure in the wizard, e.g.:
    #   - "1514:1514/udp"   # syslog UDP
    #   - "1514:1514/tcp"   # syslog TCP

  tlsoc-webui:
    build:
      # Root context is deliberate: the image compiles the version-matched
      # MkDocs Help Center alongside the Console. Root .dockerignore keeps the
      # context limited to VERSION, docs/overrides, the builder, and webui.
      context: ..
      dockerfile: webui/Dockerfile
      args:
        TLSOC_VERSION: ${TLSOC_VERSION:-source}
        TLSOC_RELEASE_CHANNEL: ${TLSOC_RELEASE_CHANNEL:-testing}
        TLSOC_BUILD_SHA: ${TLSOC_BUILD_SHA:-unknown}
        TLSOC_BUILD_DATE: ${TLSOC_BUILD_DATE:-unknown}
    image: tlsoc-agentic-triage-webui:${TLSOC_VERSION:-source}
    container_name: tlsoc-webui
    restart: unless-stopped
    depends_on:
      tlsoc-backend:
        condition: service_healthy
    ports:
      - "8080:80"   # open http://localhost:8080

  agentic-soc-updater:
    build:
      context: ../updater
      dockerfile: Dockerfile
      args:
        TLSOC_VERSION: ${TLSOC_VERSION:-source}
        TLSOC_RELEASE_CHANNEL: ${TLSOC_RELEASE_CHANNEL:-testing}
        TLSOC_BUILD_SHA: ${TLSOC_BUILD_SHA:-unknown}
        TLSOC_BUILD_DATE: ${TLSOC_BUILD_DATE:-unknown}
        TLSOC_SOURCE_URL: https://github.com/${AGENTIC_SOC_UPDATE_REPOSITORY:-ARYDESTROYER/Agentic-Kibana}
    image: agentic-soc-updater:${TLSOC_VERSION:-source}
    container_name: agentic-soc-updater
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    environment:
      - UPDATE_TRUSTED_REPOSITORY=${AGENTIC_SOC_UPDATE_REPOSITORY:-ARYDESTROYER/Agentic-Kibana}
      - UPDATE_COMPOSE_FILE=/deployment/docker-compose.yml
      - UPDATE_ENV_FILE=/deployment/.env
      - UPDATE_STATE_DIR=/var/lib/agentic-soc-updater
      - UPDATE_BACKUP_DIR=/var/backups/agentic-soc
      - UPDATE_HOST_OVERRIDE_FILE=/deployment/host-runtime/active-release.compose.yml
      - UPDATE_CONTROL_SOCKET=/run/agentic-soc-updater/control.sock
      - UPDATE_CONTROL_GID=10001
    volumes:
      # Deliberate privilege boundary: only this supervisor sees the Docker socket.
      # Its accepted operations, services, paths, registry, release identity, and
      # migration strategy are fixed in code and verified from signed metadata.
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - ./docker-compose.agnostic.yml:/deployment/docker-compose.yml:ro
      - ../.env:/deployment/.env:ro
      # Public digest pins only. The official lifecycle wrapper automatically
      # consumes this host-visible generated override after the first update.
      - ../.agentic-soc-runtime:/deployment/host-runtime:rw
      - agentic-soc-updater-control:/run/agentic-soc-updater:rw
      - agentic-soc-updater-state:/var/lib/agentic-soc-updater:rw
      - agentic-soc-updater-backups:/var/backups/agentic-soc:rw
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m

volumes:
  tlsoc-pgdata:
  agentic-soc-updater-control:
  agentic-soc-updater-state:
  agentic-soc-updater-backups:
